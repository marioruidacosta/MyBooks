name: Releases job

# Every night: harvests the National Library's new legal-deposit records, updates the monthly lists of new books
# by genre (kept on the releases-data branch) and publishes them on GitHub Pages for the app's "New in Portugal".
# See docs/releases-setup.md.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths: ["releases/**", ".github/workflows/releases.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: releases-job
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Job tests
        run: bash .github/scripts/annotate.sh ./gradlew :releases:test

  publish:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out the data branch (created on the first run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin releases-data > /dev/null; then
            git clone --quiet --single-branch --branch releases-data "$remote" data
          else
            mkdir data
            git -C data init --quiet -b releases-data
            git -C data remote add origin "$remote"
            git -C data commit --quiet --allow-empty -m "Start releases data"
          fi
      - name: Harvest
        run: bash .github/scripts/annotate.sh ./gradlew :releases:run --args="--data-dir $GITHUB_WORKSPACE/data"
      - name: Save the data
        run: |
          cd data
          git add -A
          if ! git diff --cached --quiet; then
            git commit --quiet -m "Releases $(date -u +%F)"
          fi
          git push --quiet origin releases-data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data
      - id: deploy
        uses: actions/deploy-pages@v4
