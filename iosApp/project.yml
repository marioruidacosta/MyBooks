# XcodeGen project for the iPhone app. Generated in CI (`xcodegen generate`); not edited by hand.
name: MyBooks
options:
  bundleIdPrefix: com.mcosta
  deploymentTarget:
    iOS: "16.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
targets:
  MyBooks:
    type: application
    platform: iOS
    sources:
      - MyBooks
    scheme: {}
    info:
      path: MyBooks/Info.plist
      properties:
        CFBundleDisplayName: MyBooks
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GoogleBooksApiKey: "$(GOOGLE_BOOKS_API_KEY)"
        NSCameraUsageDescription: MyBooks uses the camera to scan book barcodes and photograph covers.
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_NAME: MyBooks
        PRODUCT_BUNDLE_IDENTIFIER: com.mcosta.mybooks
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
        # The shared Kotlin framework is built for Apple Silicon simulators only (iosSimulatorArm64).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - Shared
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
